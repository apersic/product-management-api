services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: products
      POSTGRES_PASSWORD: products
      POSTGRES_DB: products
    volumes:
      - product-pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U products -d products']
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - '5432:5432'

  api:
    build: .
    ports:
      - '3000:3000'
    environment:
      PORT: '3000'
      DATABASE_URL: postgres://products:products@db:5432/products
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(''http://127.0.0.1:3000/health'').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  product-pg:
